<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nEF® アニメーション</title>
<style>
body { margin: 0; background: #F4F8FB; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
@keyframes nef2-dropL { 0% { transform: translateY(-230px); opacity: 0; } 8% { opacity: 1; } 42% { transform: translateY(0px); } 55% { transform: translateY(-4px); } 68% { transform: translateY(0px); } 88% { opacity: 1; transform: translateY(0px); } 100% { opacity: 0; transform: translateY(0px); } }
@keyframes nef2-pass { 0% { transform: translateY(-250px) translateX(0px); opacity: 0; } 7% { opacity: 0.95; } 25% { transform: translateY(-180px) translateX(4px); } 45% { transform: translateY(-90px) translateX(-4px); } 60% { transform: translateY(0px) translateX(2px); opacity: 0.9; } 80% { transform: translateY(30px) translateX(0px); opacity: 0; } 100% { transform: translateY(30px) translateX(0px); opacity: 0; } }
@keyframes floaty { 0%, 100% { transform: translate(0px,0px); } 50% { transform: translate(5px,-11px); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
@keyframes wavedrift { 0%, 100% { transform: translateX(0px); } 50% { transform: translateX(-8px); } }
@media (prefers-reduced-motion: reduce) { svg * { animation: none !important; } }
</style>
</head>
<body>
<div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
  <div style="position:relative; width:320px; height:320px; border-radius:16px; overflow:hidden; background:#EAF2F8;">
    <svg width="320" height="320" viewBox="0 0 320 320" style="display:block;">
      <defs>
        <radialGradient id="bg2" cx="48%" cy="45%" r="75%">
          <stop offset="0%" stop-color="#EAF2F8"></stop>
          <stop offset="100%" stop-color="#7FA8C9" stop-opacity="0.26"></stop>
        </radialGradient>
        <radialGradient id="gray2" cx="35%" cy="32%" r="80%">
          <stop offset="0%" stop-color="#B2C0CB"></stop>
          <stop offset="60%" stop-color="#8B9BA8"></stop>
          <stop offset="100%" stop-color="#77899A"></stop>
        </radialGradient>
        <radialGradient id="white2" cx="35%" cy="32%" r="80%">
          <stop offset="0%" stop-color="#FFFFFF"></stop>
          <stop offset="70%" stop-color="#F4F9FC"></stop>
          <stop offset="100%" stop-color="#DCE9F3"></stop>
        </radialGradient>
        <filter id="bl2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"></feGaussianBlur></filter>
      </defs>
      <rect x="0" y="0" width="320" height="320" fill="url(#bg2)"></rect>
      <g data-layer="depth">
        <circle cx="80" cy="100" r="115" fill="#FFFFFF" opacity="0.07"></circle>
        <circle cx="250" cy="240" r="125" fill="#7FA8C9" opacity="0.06"></circle>
      </g>
      <line x1="160" y1="14" x2="160" y2="306" stroke="#7FA8C9" stroke-opacity="0.35" stroke-width="1"></line>
      <g>
        <rect x="30" y="13" width="100" height="23" rx="11.5" fill="#FFFFFF" opacity="0.6"></rect>
        <text x="80" y="29" text-anchor="middle" font-size="11" fill="#1A70A8">未処理の乳酸菌</text>
      </g>
      <g>
        <rect x="164" y="13" width="152" height="23" rx="11.5" fill="#FFFFFF" opacity="0.6"></rect>
        <text x="240" y="29" text-anchor="middle" font-size="11" fill="#1A70A8">ナノ型乳酸菌(nEF®)</text>
      </g>
      <g data-layer="mesh" fill="none" stroke="#7FA8C9" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6">
        <g style="animation: wavedrift 10s ease-in-out infinite;">
          <path d="M 10 204 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"></path>
          <path d="M 10 213 q 11 6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"></path>
          <path d="M 10 222 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"></path>
        </g>
        <g style="animation: wavedrift 10s ease-in-out infinite; animation-delay:-5s;">
          <path d="M 178 204 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"></path>
          <path d="M 178 213 q 11 6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"></path>
          <path d="M 178 222 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"></path>
        </g>
      </g>
      <g data-layer="ambient" fill="#1A70A8" fill-opacity="0.1">
        <circle cx="70" cy="230" r="2.5" style="animation: floaty 12s ease-in-out infinite;"></circle>
        <circle cx="240" cy="70" r="2" style="animation: floaty 10s ease-in-out infinite; animation-delay:-3s;"></circle>
        <circle cx="130" cy="270" r="2" style="animation: floaty 13s ease-in-out infinite; animation-delay:-6s;"></circle>
        <circle cx="280" cy="140" r="2.5" style="animation: floaty 9s ease-in-out infinite; animation-delay:-1.5s;"></circle>
      </g>
      <g style="animation: nef2-dropL 8s ease-in-out infinite;">
        <g transform="translate(70,172) scale(1.35)">
          <circle cx="0" cy="0" r="26" fill="#8B9BA8" opacity="0.18" filter="url(#bl2)"></circle>
          <g fill="url(#gray2)" style="animation: breathe 3.6s ease-in-out infinite;">
            <circle cx="-14" cy="-8" r="5"></circle><circle cx="-4" cy="-16" r="5.5"></circle><circle cx="8" cy="-12" r="5"></circle><circle cx="15" cy="-2" r="5"></circle><circle cx="10" cy="9" r="5.5"></circle><circle cx="-1" cy="14" r="5"></circle><circle cx="-12" cy="7" r="5"></circle><circle cx="2" cy="-2" r="6"></circle><circle cx="-18" cy="2" r="4.5"></circle><circle cx="16" cy="-12" r="4"></circle>
          </g>
        </g>
      </g>
      <g style="animation: nef2-dropL 8s ease-in-out infinite; animation-delay:-0.9s;">
        <g transform="translate(124,170) scale(1.3)">
          <circle cx="0" cy="0" r="24" fill="#8B9BA8" opacity="0.18" filter="url(#bl2)"></circle>
          <g fill="url(#gray2)" style="animation: breathe 3.6s ease-in-out infinite; animation-delay:-1.5s;">
            <circle cx="-12" cy="-6" r="5"></circle><circle cx="-2" cy="-14" r="5"></circle><circle cx="9" cy="-8" r="5.5"></circle><circle cx="13" cy="3" r="5"></circle><circle cx="4" cy="11" r="5"></circle><circle cx="-8" cy="9" r="5"></circle><circle cx="0" cy="0" r="6"></circle><circle cx="-16" cy="0" r="4.5"></circle><circle cx="14" cy="-13" r="4"></circle>
          </g>
        </g>
      </g>
      <g fill="url(#white2)" stroke="#1A70A8" stroke-width="0.75" stroke-opacity="0.45">
        <circle cx="176" cy="248" r="5" style="animation: nef2-pass 8s ease-in-out infinite;"></circle>
        <circle cx="192" cy="270" r="4" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-0.3s;"></circle>
        <circle cx="206" cy="240" r="3" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-0.6s;"></circle>
        <circle cx="220" cy="284" r="5" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-0.9s;"></circle>
        <circle cx="234" cy="256" r="3.5" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-1.2s;"></circle>
        <circle cx="247" cy="234" r="4.5" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-0.45s;"></circle>
        <circle cx="260" cy="272" r="4" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-0.75s;"></circle>
        <circle cx="273" cy="246" r="3" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-1.05s;"></circle>
        <circle cx="286" cy="264" r="5" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-1.35s;"></circle>
        <circle cx="298" cy="238" r="3.5" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-1.65s;"></circle>
        <circle cx="212" cy="262" r="4.5" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-1.9s;"></circle>
        <circle cx="240" cy="280" r="3" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-2.2s;"></circle>
        <circle cx="268" cy="288" r="4" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-2.5s;"></circle>
        <circle cx="290" cy="286" r="3.5" style="animation: nef2-pass 8s ease-in-out infinite; animation-delay:-2.8s;"></circle>
      </g>
    </svg>
    <span style="position:absolute; right:10px; bottom:8px; font-size:10px; color:#8a97a3;">※イメージ図</span>
  </div>
</div>
</body>
</html>
